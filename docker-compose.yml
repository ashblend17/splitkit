name: splitkit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: splitkit
      POSTGRES_USER: splitkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitkit}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitkit -d splitkit"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://splitkit:${POSTGRES_PASSWORD:-splitkit}@db:5432/splitkit
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Keeps linked groups in sync with Tricount (api/app/modules/tricount_sync). Remove this
  # service to turn the sync off; links then just stop updating.
  tricount:
    build: ./api
    command: ["python", "-m", "app.modules.tricount_sync"]
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg://splitkit:${POSTGRES_PASSWORD:-splitkit}@db:5432/splitkit
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please}
    depends_on:
      api:
        condition: service_healthy  # its start-up runs the migrations
    restart: unless-stopped

  web:
    build: ./app
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
