[project]
name = "splitkit-api"
version = "0.1.0"
description = "Splitkit REST API (/api/v1): a FastAPI modular monolith"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]
target-version = "py313"

[tool.ruff.format]
# Hand-aligned data tables read better unformatted.
exclude = ["app/seed/data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/seed/data.py" = ["E501", "E241"]
